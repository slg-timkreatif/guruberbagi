<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pendaftaran Akun Guru Berbagi - Selogiri</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      max-width: 500px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 30px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      max-width: 80px;
      margin-bottom: 10px;
    }

    .header h1 {
      color: #2c3e50;
      font-size: 22px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #7f8c8d;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #34495e;
      font-weight: 500;
      font-size: 14px;
    }

    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
    }

    .form-group input[readonly] {
      background: #f4f4f4;
      cursor: not-allowed;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      margin-top: 8px;
      font-size: 13px;
      color: #555;
    }

    .checkbox-group input {
      margin-right: 6px;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .footer-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
    }

    .footer-link a {
      color: #667eea;
      text-decoration: none;
    }

    /* ===== Modal ===== */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      max-width: 420px;
      width: 90%;
      border-radius: 12px;
      overflow: hidden;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      background: #2c3e50;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .modal-header.error {
      background: #e74c3c;
    }

    .modal-header h2 {
      font-size: 18px;
    }

    .modal-body {
      padding: 25px;
      text-align: center;
    }

    .pin-box {
      background: #ecf0f1;
      border-left: 5px solid #2c3e50;
      padding: 20px;
      margin: 20px 0;
    }

    .pin-number {
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 5px;
      color: #2c3e50;
    }

    .pin-note {
      font-size: 12px;
      color: #777;
      margin-top: 15px;
    }

    .modal-content .btn-primary {
      margin: 0 25px 25px;
      width: calc(100% - 50px);
    }

    @media (max-width: 480px) {
      .container { padding: 20px; }
      .header h1 { font-size: 18px; }
      .pin-number { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img
        src="https://raw.githubusercontent.com/slg-timkreatif/app/refs/heads/main/1768315347206.png"
        alt="Logo"
        class="logo"
      />
      <h1>Pendaftaran Akun Guru Berbagi</h1>
      <p class="subtitle">Korwilcambidik Kecamatan Selogiri</p>
    </div>

    <form id="formDaftar" autocomplete="off">
      <div class="form-group">
        <label for="nama">Nama Lengkap (dengan gelar)</label>
        <input type="text" id="nama" name="nama" required />
      </div>

      <div class="form-group">
        <label for="email">Email Aktif</label>
        <input type="email" id="email" name="email" required />
      </div>

      <div class="form-group">
        <label for="nip">NIP</label>
        <input type="text" id="nip" name="nip" placeholder="18 digit NIP" />
        <div class="checkbox-group">
          <input type="checkbox" id="noNip" />
          <label for="noNip">Saya belum memiliki NIP (Gunakan Email sebagai ID)</label>
        </div>
      </div>

      <div class="form-group">
        <label for="jabatan">Jabatan</label>
        <select id="jabatan" name="jabatan" required>
          <option value="">Memuat data...</option>
        </select>
        <input
          type="text"
          id="jabatanLainnya"
          name="jabatanLainnya"
          placeholder="Sebutkan Jabatan Lainnya"
          style="display: none; margin-top: 8px;"
        />
      </div>

      <div class="form-group">
        <label for="satuan">Satuan Pendidikan</label>
        <select id="satuan" name="satuan" required>
          <option value="">Memuat data...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="npsn">NPSN</label>
        <input type="text" id="npsn" name="npsn" readonly />
      </div>

      <button type="submit" id="btnSubmit" class="btn-primary">
        <span class="btn-text">Daftarkan & Generate PIN</span>
        <span class="btn-loader" style="display: none;">Sedang memproses... Mohon tunggu.</span>
      </button>
    </form>

    <div class="footer-link">
      <a href="admin.html">🔐 Login Admin</a>
    </div>
  </div>

  <!-- Modal Sukses / Duplikat -->
  <div id="modalPinContainer" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header" id="modalHeader">
        <h2>Pendaftaran Berhasil!</h2>
      </div>
      <div class="modal-body">
        <p>Halo, <strong id="modalNama"></strong>.</p>
        <p id="modalPesan">PIN Anda adalah:</p>
        <div class="pin-box">
          <span id="modalPinValue" class="pin-number"></span>
        </div>
        <p class="pin-note">*Simpan PIN ini. Jangan bagikan kepada siswa.</p>
      </div>
      <button id="btnTutupModal" class="btn-primary">Tutup</button>
    </div>
  </div>

  <!-- Modal Error -->
  <div id="modalError" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header error">
        <h2>Terjadi Kesalahan</h2>
      </div>
      <div class="modal-body">
        <p id="errorPesan"></p>
      </div>
      <button id="btnTutupError" class="btn-primary">Tutup</button>
    </div>
  </div>

  <!-- Library Supabase (WAJIB sebelum script utama) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ============================================
    // KONFIGURASI SUPABASE (Sudah diisi milik Anda)
    // ============================================
    const SUPABASE_URL = "https://qamqqwfzhyiihqyzliwq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_O_qwmOBPSU8dylEPCrPRAA_GC25Ii5x";
    const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/register-guru`;

    let db = null;

    document.addEventListener("DOMContentLoaded", () => {
      if (typeof window.supabase === "undefined") {
        alert("Gagal memuat library Supabase. Periksa koneksi internet Anda, lalu refresh halaman.");
        return;
      }
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      loadDropdowns();
      setupEventListeners();
    });

    // ============================================
    // 1. LOAD DROPDOWN JABATAN & SEKOLAH
    // ============================================
    async function loadDropdowns() {
      try {
        const [{ data: jabatanData }, { data: sekolahData }] = await Promise.all([
          db.from("jabatan").select("nama").order("nama"),
          db.from("sekolah").select("nama, npsn").order("nama"),
        ]);

        const jabatanSelect = document.getElementById("jabatan");
        jabatanSelect.innerHTML = '<option value="">-- Pilih Jabatan --</option>';
        (jabatanData || []).forEach((j) => {
          jabatanSelect.add(new Option(j.nama, j.nama));
        });
        jabatanSelect.add(new Option("Lainnya...", "__lainnya__"));

        const satuanSelect = document.getElementById("satuan");
        satuanSelect.innerHTML = '<option value="">-- Pilih Satuan Pendidikan --</option>';
        window.sekolahMap = {};
        (sekolahData || []).forEach((s) => {
          satuanSelect.add(new Option(s.nama, s.nama));
          window.sekolahMap[s.nama] = s.npsn;
        });
      } catch (err) {
        console.error("Gagal memuat dropdown:", err);
        alert("Gagal memuat data dropdown. Silakan refresh halaman.");
      }
    }

    // ============================================
    // 2. EVENT LISTENERS
    // ============================================
    function setupEventListeners() {
      // Checkbox "Belum punya NIP"
      document.getElementById("noNip").addEventListener("change", (e) => {
        const nipInput = document.getElementById("nip");
        const emailInput = document.getElementById("email");
        if (e.target.checked) {
          nipInput.value = emailInput.value;
          nipInput.readOnly = true;
        } else {
          nipInput.value = "";
          nipInput.readOnly = false;
        }
      });

      // Sync email -> NIP jika checkbox dicentang
      document.getElementById("email").addEventListener("input", (e) => {
        if (document.getElementById("noNip").checked) {
          document.getElementById("nip").value = e.target.value;
        }
      });

      // Pilih jabatan "Lainnya" -> tampilkan input teks
      document.getElementById("jabatan").addEventListener("change", (e) => {
        const inputLain = document.getElementById("jabatanLainnya");
        if (e.target.value === "__lainnya__") {
          inputLain.style.display = "block";
          inputLain.required = true;
        } else {
          inputLain.style.display = "none";
          inputLain.required = false;
          inputLain.value = "";
        }
      });

      // Pilih satuan pendidikan -> auto-fill NPSN
      document.getElementById("satuan").addEventListener("change", (e) => {
        const nama = e.target.value;
        document.getElementById("npsn").value = (window.sekolahMap && window.sekolahMap[nama]) || "";
      });

      // Submit form
      document.getElementById("formDaftar").addEventListener("submit", handleSubmit);

      // Tombol tutup modal
      document.getElementById("btnTutupModal").addEventListener("click", () => {
        document.getElementById("modalPinContainer").style.display = "none";
      });
      document.getElementById("btnTutupError").addEventListener("click", () => {
        document.getElementById("modalError").style.display = "none";
      });
    }

    // ============================================
    // 3. HANDLE SUBMIT FORM
    // ============================================
    async function handleSubmit(e) {
      e.preventDefault();

      const btn = document.getElementById("btnSubmit");
      const btnText = btn.querySelector(".btn-text");
      const btnLoader = btn.querySelector(".btn-loader");

      const nama = document.getElementById("nama").value.trim();
      const email = document.getElementById("email").value.trim();
      const nip = document.getElementById("nip").value.trim();
      const jabatanRaw = document.getElementById("jabatan").value;
      const jabatanLain = document.getElementById("jabatanLainnya").value.trim();
      const satuan = document.getElementById("satuan").value;
      const npsn = document.getElementById("npsn").value.trim();

      const jabatan = jabatanRaw === "__lainnya__" ? jabatanLain : jabatanRaw;
      if (!jabatan) {
        tampilkanError("Mohon pilih atau isi jabatan.");
        return;
      }

      btn.disabled = true;
      btnText.style.display = "none";
      btnLoader.style.display = "inline";

      try {
        const response = await fetch(FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          },
          body: JSON.stringify({ nama, nip, jabatan, satuan, npsn, email }),
        });

        const result = await response.json();

        if (result.status === "sukses") {
          tampilkanModal(result.nama, result.pin, "sukses");
          document.getElementById("formDaftar").reset();
          document.getElementById("nip").readOnly = false;
          document.getElementById("jabatanLainnya").style.display = "none";
        } else if (result.status === "duplikat") {
          tampilkanModal(result.nama, result.pin, "duplikat");
        } else {
          tampilkanError(result.error || "Terjadi kesalahan tidak diketahui.");
        }
      } catch (err) {
        tampilkanError("Gagal terhubung ke server: " + err.message);
      } finally {
        btn.disabled = false;
        btnText.style.display = "inline";
        btnLoader.style.display = "none";
      }
    }

    // ============================================
    // 4. MODAL HELPER
    // ============================================
    function tampilkanModal(nama, pin, tipe) {
      const header = document.getElementById("modalHeader");
      const pesan = document.getElementById("modalPesan");

      if (tipe === "duplikat") {
        header.querySelector("h2").textContent = "Akun Sudah Terdaftar";
        header.style.background = "#d35400";
        pesan.textContent = "Kami menemukan akun Anda. PIN Anda adalah:";
      } else {
        header.querySelector("h2").textContent = "Pendaftaran Berhasil!";
        header.style.background = "#2c3e50";
        pesan.textContent = "PIN Anda adalah:";
      }

      document.getElementById("modalNama").textContent = nama;
      document.getElementById("modalPinValue").textContent = pin;
      document.getElementById("modalPinContainer").style.display = "flex";
    }

    function tampilkanError(pesan) {
      document.getElementById("errorPesan").textContent = pesan;
      document.getElementById("modalError").style.display = "flex";
    }
  </script>
</body>
</html>
