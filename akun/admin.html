<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard · Guru Berbagi Selogiri</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --primary:#6366f1; --primary-600:#4f46e5; --primary-soft:#eef2ff;
    --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b;
    --border:#e2e8f0; --green:#059669; --green-soft:#ecfdf5;
    --red:#dc2626; --red-soft:#fef2f2; --amber:#d97706; --amber-soft:#fffbeb;
    --radius:16px; --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.07);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  .hidden{display:none!important}
  button,input,select{font-family:inherit}
  .lucide{width:18px;height:18px}
  .spin{animation:rot 1s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  /* ============ LOGIN ============ */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:20px}
  .login-card{background:#fff;border-radius:20px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center}
  .login-logo{width:64px;height:64px;border-radius:18px;background:var(--primary-soft);color:var(--primary-600);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  .login-logo .lucide{width:30px;height:30px}
  .login-card h1{font-size:20px;font-weight:800}
  .login-card .sub{color:var(--muted);font-size:13px;margin:4px 0 26px}
  .field{margin-bottom:16px;text-align:left}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .input-icon{position:relative;display:flex;align-items:center}
  .input-icon>.lucide{position:absolute;left:12px;color:var(--muted);width:16px;height:16px;pointer-events:none}
  .input-icon input{width:100%;padding:11px 40px 11px 38px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none;transition:.15s}
  .input-icon input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
  .pass-toggle{position:absolute;right:8px;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;display:flex}
  .pass-toggle:hover{color:var(--text)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:14px;cursor:pointer;transition:.15s}
  .btn-primary{background:var(--primary-600);color:#fff;width:100%}
  .btn-primary:hover{background:#4338ca}
  .btn-primary:disabled{opacity:.6;cursor:not-allowed}
  .btn-danger{background:var(--red);color:#fff}
  .btn-danger:hover{background:#b91c1c}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
  .btn-ghost:hover{background:#f1f5f9;color:var(--text)}
  .back-link{display:inline-flex;align-items:center;gap:6px;margin-top:18px;color:var(--muted);font-size:12.5px;text-decoration:none}
  .back-link:hover{color:var(--text)}
  .back-link .lucide{width:14px;height:14px}

  /* ============ TOPBAR ============ */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:12px 24px;gap:12px}
  .topbar-left{display:flex;align-items:center;gap:12px}
  .brand-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;display:flex;align-items:center;justify-content:center}
  .topbar-left h1{font-size:15px;font-weight:800}
  .topbar-left span{font-size:11.5px;color:var(--muted)}
  .topbar-right{display:flex;align-items:center;gap:10px}
  .admin-chip{display:inline-flex;align-items:center;gap:8px;background:var(--primary-soft);color:var(--primary-600);padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:600}
  .admin-chip .lucide{width:14px;height:14px}

  /* ============ CONTENT ============ */
  .content{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow)}
  .stat-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .stat-icon .lucide{width:22px;height:22px}
  .si-indigo{background:var(--primary-soft);color:var(--primary-600)}
  .si-green{background:var(--green-soft);color:var(--green)}
  .si-red{background:var(--red-soft);color:var(--red)}
  .si-amber{background:var(--amber-soft);color:var(--amber)}
  .stat-info b{display:block;font-size:22px;font-weight:800;line-height:1.1}
  .stat-info span{font-size:12px;color:var(--muted);font-weight:500}

  /* ============ TABLE ============ */
  .table-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .table-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 20px;border-bottom:1px solid var(--border)}
  .table-toolbar h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
  .table-toolbar h2 .lucide{color:var(--primary-600)}
  .toolbar-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .search-box{position:relative;display:flex;align-items:center}
  .search-box .lucide{position:absolute;left:11px;width:15px;height:15px;color:var(--muted);pointer-events:none}
  .search-box input{padding:9px 12px 9px 34px;border:1px solid var(--border);border-radius:10px;font-size:13px;outline:none;width:240px;transition:.15s}
  .search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
  .toolbar-controls select{padding:9px 12px;border:1px solid var(--border);border-radius:10px;font-size:13px;outline:none;background:#fff;cursor:pointer}
  .icon-btn{width:36px;height:36px;border:1px solid var(--border);background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;transition:.15s}
  .icon-btn:hover{color:var(--primary-600);border-color:#c7d2fe;background:var(--primary-soft)}
  .icon-btn .lucide{width:15px;height:15px}
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:960px}
  thead th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:12px 16px;background:#f8fafc;border-bottom:1px solid var(--border);white-space:nowrap}
  tbody td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr:hover{background:#f8fafc}
  .col-no{color:var(--muted);font-size:12.5px}
  .cell-guru strong{display:block;font-weight:600}
  .cell-guru span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--muted)}
  .pin-mask{letter-spacing:2px;color:var(--muted)}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .badge .dot{width:6px;height:6px;border-radius:50%}
  .badge-aktif{background:var(--green-soft);color:var(--green)} .badge-aktif .dot{background:var(--green)}
  .badge-non{background:var(--red-soft);color:var(--red)} .badge-non .dot{background:var(--red)}
  .acts{display:flex;gap:6px}
  .act-btn{width:32px;height:32px;border:1px solid var(--border);background:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:.15s}
  .act-btn .lucide{width:15px;height:15px}
  .act-btn.view:hover{background:var(--primary-soft);color:var(--primary-600);border-color:#c7d2fe}
  .act-btn.edit:hover{background:var(--amber-soft);color:var(--amber);border-color:#fde68a}
  .act-btn.disable:hover{background:var(--red-soft);color:var(--red);border-color:#fecaca}
  .table-footer{padding:14px 20px;font-size:12.5px;color:var(--muted)}
  .empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:48px 20px;color:var(--muted)}
  .empty .lucide{width:36px;height:36px;opacity:.5}

  /* ============ MODAL ============ */
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal-card{background:#fff;border-radius:20px;width:100%;max-width:480px;box-shadow:0 24px 80px rgba(0,0,0,.3);animation:pop .25s ease;overflow:hidden;max-height:92vh;display:flex;flex-direction:column}
  @keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border)}
  .modal-head h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
  .modal-head h3 .lucide{width:17px;height:17px;color:var(--primary-600)}
  .modal-close{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;display:flex;border-radius:8px}
  .modal-close:hover{background:#f1f5f9;color:var(--text)}
  .modal-body{padding:22px;overflow-y:auto}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:#f8fafc}
  .input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none;transition:.15s}
  .input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
  .input[readonly]{background:#f8fafc;color:var(--muted);cursor:not-allowed}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pin-display{background:var(--primary-soft);border:2px dashed #c7d2fe;border-radius:14px;padding:20px;text-align:center;margin:16px 0}
  .pin-display .pin{font-size:40px;font-weight:800;letter-spacing:8px;color:var(--primary-600)}
  .confirm-icon{width:56px;height:56px;border-radius:16px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .confirm-icon .lucide{width:26px;height:26px}
  .confirm-text{text-align:center;color:var(--muted);line-height:1.6}
  .confirm-text strong{color:var(--text)}

  /* ============ TOAST ============ */
  #toastContainer{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:10px;z-index:300}
  .toast{display:flex;align-items:center;gap:10px;background:#0f172a;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:slidein .25s ease;font-size:13.5px;max-width:340px}
  .toast .lucide{width:17px;height:17px;flex-shrink:0}
  .toast.success .lucide{color:#34d399}
  .toast.error .lucide{color:#f87171}
  .toast.out{opacity:0;transform:translateX(12px);transition:.3s}
  @keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  @media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.stats{grid-template-columns:1fr}.admin-chip{display:none}.search-box input{width:100%}.grid-2{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="login-logo"><i data-lucide="shield-check"></i></div>
    <h1>Admin Dashboard</h1>
    <p class="sub">Guru Berbagi · Korwilcambidik Selogiri</p>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="loginEmail">Email</label>
        <div class="input-icon">
          <i data-lucide="mail"></i>
          <input type="email" id="loginEmail" placeholder="admin@email.com" required />
        </div>
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <div class="input-icon">
          <i data-lucide="lock"></i>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
          <button type="button" class="pass-toggle" id="togglePass" title="Tampilkan password"><i data-lucide="eye"></i></button>
        </div>
      </div>
      <button class="btn btn-primary" id="loginBtn" type="submit">
        <i data-lucide="log-in"></i><span id="loginLabel">Masuk</span>
      </button>
    </form>
    <a href="index.html" class="back-link"><i data-lucide="arrow-left"></i> Kembali ke Form Pendaftaran</a>
  </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div id="dashboardView" class="hidden">
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand-icon"><i data-lucide="graduation-cap"></i></div>
      <div>
        <h1>Guru Berbagi</h1>
        <span>Admin Dashboard · Selogiri</span>
      </div>
    </div>
    <div class="topbar-right">
      <span class="admin-chip"><i data-lucide="user-cog"></i><span id="adminEmail"></span></span>
      <button id="logoutBtn" class="btn btn-ghost"><i data-lucide="log-out"></i> Keluar</button>
    </div>
  </header>

  <main class="content">
    <!-- Statistik -->
    <section class="stats">
      <div class="stat-card"><div class="stat-icon si-indigo"><i data-lucide="users"></i></div><div class="stat-info"><b id="statTotal">0</b><span>Total Guru</span></div></div>
      <div class="stat-card"><div class="stat-icon si-green"><i data-lucide="user-check"></i></div><div class="stat-info"><b id="statAktif">0</b><span>Akun Aktif</span></div></div>
      <div class="stat-card"><div class="stat-icon si-red"><i data-lucide="user-x"></i></div><div class="stat-info"><b id="statNon">0</b><span>Non Aktif</span></div></div>
      <div class="stat-card"><div class="stat-icon si-amber"><i data-lucide="building-2"></i></div><div class="stat-info"><b id="statSekolah">0</b><span>Sekolah</span></div></div>
    </section>

    <!-- Tabel -->
    <section class="table-card">
      <div class="table-toolbar">
        <h2><i data-lucide="table-2"></i> Data Guru</h2>
        <div class="toolbar-controls">
          <div class="search-box"><i data-lucide="search"></i><input id="searchInput" placeholder="Cari nama, email, NIP, PIN..." /></div>
          <select id="statusFilter">
            <option value="semua">Semua Status</option>
            <option value="Aktif">Aktif</option>
            <option value="Non Aktif">Non Aktif</option>
          </select>
          <button class="icon-btn" id="refreshBtn" title="Muat ulang data"><i data-lucide="refresh-cw"></i></button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>No</th><th>Guru</th><th>NIP</th><th>Jabatan</th>
              <th>Satuan Pendidikan</th><th>PIN</th><th>Status</th><th>Aksi</th>
            </tr>
          </thead>
          <tbody id="guruTbody"></tbody>
        </table>
      </div>
      <div class="table-footer"><span id="countInfo"></span></div>
    </section>
  </main>
</div>

<!-- ================= MODAL EDIT ================= -->
<div id="editModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h3><i data-lucide="pencil"></i> Edit Data Guru</h3>
      <button class="modal-close" data-close="editModal"><i data-lucide="x"></i></button>
    </div>
    <form id="editForm">
      <div class="modal-body">
        <div class="field">
          <label for="editNama">Nama Lengkap</label>
          <input class="input" id="editNama" required />
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="editNip">NIP</label>
            <input class="input" id="editNip" placeholder="Kosongkan jika tidak ada" />
          </div>
          <div class="field">
            <label for="editEmail">Email</label>
            <input class="input" id="editEmail" type="email" required />
          </div>
        </div>
        <div class="field">
          <label for="editJabatan">Jabatan</label>
          <input class="input" id="editJabatan" list="jabatanList" required />
          <datalist id="jabatanList"></datalist>
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="editSekolah">Satuan Pendidikan</label>
            <select class="input" id="editSekolah"></select>
          </div>
          <div class="field">
            <label for="editNpsn">NPSN (otomatis)</label>
            <input class="input" id="editNpsn" readonly />
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-close="editModal">Batal</button>
        <button type="submit" class="btn btn-primary" style="width:auto"><i data-lucide="save"></i> Simpan</button>
      </div>
    </form>
  </div>
</div>

<!-- ================= MODAL PIN ================= -->
<div id="pinModal" class="modal hidden">
  <div class="modal-card" style="max-width:400px">
    <div class="modal-head">
      <h3><i data-lucide="key-round"></i> PIN Akses</h3>
      <button class="modal-close" data-close="pinModal"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body" style="text-align:center">
      <p style="font-weight:700;font-size:15px" id="pinNama"></p>
      <p style="color:var(--muted);font-size:12.5px;margin-top:2px" id="pinSekolah"></p>
      <div class="pin-display"><span class="pin" id="pinValue"></span></div>
      <button class="btn btn-primary" id="copyPin" style="width:100%"><i data-lucide="copy"></i> Salin PIN</button>
    </div>
  </div>
</div>

<!-- ================= MODAL KONFIRMASI ================= -->
<div id="confirmModal" class="modal hidden">
  <div class="modal-card" style="max-width:420px">
    <div class="modal-body" style="padding:30px 26px">
      <div class="confirm-icon"><i data-lucide="alert-triangle"></i></div>
      <p class="confirm-text" id="confirmText"></p>
    </div>
    <div class="modal-foot" style="justify-content:center">
      <button class="btn btn-ghost" data-close="confirmModal">Batal</button>
      <button class="btn btn-danger" id="confirmYes"><i data-lucide="user-x"></i> Nonaktifkan</button>
    </div>
  </div>
</div>

<div id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  // ============================================
  // KONFIGURASI
  // ============================================
  const SUPABASE_URL = "https://qamqqwfzhyiihqyzliwq.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_O_qwmOBPSU8dylEPCrPRAA_GC25Ii5x";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let allGuru = [], sekolahList = [], sekolahMap = {};
  let currentEditId = null, confirmId = null;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ============================================
  // INIT: CEK SESI
  // ============================================
  (async () => {
    const { data: { session } } = await db.auth.getSession();
    if (session) enterDashboard(session); else showLogin();
  })();

  db.auth.onAuthStateChange((event) => {
    if (event === "SIGNED_OUT") showLogin();
  });

  function showLogin() {
    $("dashboardView").classList.add("hidden");
    $("loginView").classList.remove("hidden");
    $("loginForm").reset();
    lucide.createIcons();
  }

  async function enterDashboard(session) {
    $("loginView").classList.add("hidden");
    $("dashboardView").classList.remove("hidden");
    $("adminEmail").textContent = session.user.email;
    await loadData();
    lucide.createIcons();
  }

  // ============================================
  // LOGIN / LOGOUT
  // ============================================
  $("togglePass").addEventListener("click", () => {
    const inp = $("loginPassword");
    const show = inp.type === "password";
    inp.type = show ? "text" : "password";
    $("togglePass").innerHTML = `<i data-lucide="${show ? "eye-off" : "eye"}"></i>`;
    lucide.createIcons();
  });

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("loginBtn").disabled = true;
    $("loginLabel").textContent = "Memeriksa...";
    const { data, error } = await db.auth.signInWithPassword({
      email: $("loginEmail").value.trim(),
      password: $("loginPassword").value,
    });
    $("loginBtn").disabled = false;
    $("loginLabel").textContent = "Masuk";
    if (error) { toast("Email atau password salah!", "error"); return; }
    enterDashboard(data.session);
  });

  $("logoutBtn").addEventListener("click", async () => {
    await db.auth.signOut();
    toast("Anda telah keluar.", "success");
  });

  // ============================================
  // MUAT DATA
  // ============================================
  async function loadData() {
    const icon = $("refreshBtn").querySelector("svg, i");
    $("refreshBtn").classList.add("spin");
    const [g, s, j] = await Promise.all([
      db.from("guru").select("*").order("waktu_input", { ascending: false }),
      db.from("sekolah").select("nama, npsn").order("nama"),
      db.from("jabatan").select("nama").order("nama"),
    ]);
    $("refreshBtn").classList.remove("spin");
    if (g.error) { toast("Gagal memuat data: " + g.error.message, "error"); return; }
    allGuru = g.data || [];
    sekolahList = s.data || [];
    sekolahMap = Object.fromEntries(sekolahList.map((x) => [x.nama, x.npsn]));
    $("jabatanList").innerHTML = (j.data || []).map((x) => `<option value="${esc(x.nama)}">`).join("");
    renderStats();
    renderTable();
  }

  $("refreshBtn").addEventListener("click", loadData);
  $("searchInput").addEventListener("input", renderTable);
  $("statusFilter").addEventListener("change", renderTable);

  // ============================================
  // RENDER
  // ============================================
  function renderStats() {
    $("statTotal").textContent = allGuru.length;
    $("statAktif").textContent = allGuru.filter((g) => g.status_akun === "Aktif").length;
    $("statNon").textContent = allGuru.filter((g) => g.status_akun !== "Aktif").length;
    $("statSekolah").textContent = sekolahList.length;
  }

  function renderTable() {
    const q = $("searchInput").value.trim().toLowerCase();
    const st = $("statusFilter").value;
    const rows = allGuru.filter((g) => {
      const matchQ = !q || [g.nama_lengkap, g.email, String(g.nip || ""), String(g.pin), g.satuan_pendidikan, g.jabatan]
        .some((v) => String(v || "").toLowerCase().includes(q));
      const matchS = st === "semua" || g.status_akun === st;
      return matchQ && matchS;
    });

    $("countInfo").textContent = `Menampilkan ${rows.length} dari ${allGuru.length} data`;

    if (!rows.length) {
      $("guruTbody").innerHTML = `<tr><td colspan="8"><div class="empty"><i data-lucide="inbox"></i><p>Tidak ada data yang cocok.</p></div></td></tr>`;
      lucide.createIcons();
      return;
    }

    $("guruTbody").innerHTML = rows.map((g, i) => `
      <tr>
        <td class="col-no">${i + 1}</td>
        <td><div class="cell-guru"><strong>${esc(g.nama_lengkap)}</strong><span>${esc(g.email)}</span></div></td>
        <td class="mono">${esc(g.nip || "—")}</td>
        <td>${esc(g.jabatan)}</td>
        <td><div class="cell-guru"><span>${esc(g.satuan_pendidikan)}</span><span>NPSN ${esc(g.npsn)}</span></div></td>
        <td><span class="pin-mask">•••••</span></td>
        <td>${g.status_akun === "Aktif"
          ? '<span class="badge badge-aktif"><span class="dot"></span>Aktif</span>'
          : '<span class="badge badge-non"><span class="dot"></span>Non Aktif</span>'}</td>
        <td><div class="acts">
          <button class="act-btn view" data-action="pin" data-id="${g.id}" title="Lihat / Salin PIN"><i data-lucide="key-round"></i></button>
          <button class="act-btn edit" data-action="edit" data-id="${g.id}" title="Edit Data"><i data-lucide="pencil"></i></button>
          ${g.status_akun === "Aktif" ? `<button class="act-btn disable" data-action="disable" data-id="${g.id}" title="Nonaktifkan Akun"><i data-lucide="user-x"></i></button>` : ""}
        </div></td>
      </tr>`).join("");
    lucide.createIcons();
  }

  // ============================================
  // AKSI TABEL (Event Delegation)
  // ============================================
  $("guruTbody").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = Number(btn.dataset.id);
    const aksi = btn.dataset.action;
    if (aksi === "pin") openPin(id);
    if (aksi === "edit") openEdit(id);
    if (aksi === "disable") openDisable(id);
  });

  // ---------- Lihat / Salin PIN ----------
  function openPin(id) {
    const g = allGuru.find((x) => x.id === id);
    if (!g) return;
    $("pinNama").textContent = g.nama_lengkap;
    $("pinSekolah").textContent = g.satuan_pendidikan;
    $("pinValue").textContent = g.pin;
    $("pinModal").classList.remove("hidden");
  }

  $("copyPin").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText($("pinValue").textContent);
      toast("PIN disalin ke clipboard.", "success");
    } catch {
      toast("Gagal menyalin. Catat PIN secara manual.", "error");
    }
  });

  // ---------- Edit Data ----------
  function openEdit(id) {
    const g = allGuru.find((x) => x.id === id);
    if (!g) return;
    currentEditId = id;
    $("editNama").value = g.nama_lengkap;
    $("editNip").value = g.nip || "";
    $("editEmail").value = g.email;
    $("editJabatan").value = g.jabatan;

    let opts = sekolahList.map((s) => `<option value="${esc(s.nama)}">${esc(s.nama)}</option>`).join("");
    if (!sekolahList.some((s) => s.nama === g.satuan_pendidikan)) {
      opts = `<option value="${esc(g.satuan_pendidikan)}">${esc(g.satuan_pendidikan)}</option>` + opts;
    }
    $("editSekolah").innerHTML = opts;
    $("editSekolah").value = g.satuan_pendidikan;
    $("editNpsn").value = g.npsn;
    $("editModal").classList.remove("hidden");
  }

  $("editSekolah").addEventListener("change", () => {
    $("editNpsn").value = sekolahMap[$("editSekolah").value] || "";
  });

  $("editForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {
      nama_lengkap: $("editNama").value.trim(),
      nip: $("editNip").value.trim() || null,
      jabatan: $("editJabatan").value.trim(),
      satuan_pendidikan: $("editSekolah").value,
      npsn: $("editNpsn").value.trim(),
      email: $("editEmail").value.trim().toLowerCase(),
    };
    const { error } = await db.from("guru").update(payload).eq("id", currentEditId);
    if (error) { toast("Gagal menyimpan: " + error.message, "error"); return; }
    $("editModal").classList.add("hidden");
    toast("Data berhasil diperbarui.", "success");
    await loadData();
  });

  // ---------- Nonaktifkan Akun ----------
  function openDisable(id) {
    const g = allGuru.find((x) => x.id === id);
    if (!g) return;
    confirmId = id;
    $("confirmText").innerHTML = `Nonaktifkan akun <strong>${esc(g.nama_lengkap)}</strong>?<br>Data tidak dihapus dan masih dapat dilihat pada filter "Non Aktif".`;
    $("confirmModal").classList.remove("hidden");
  }

  $("confirmYes").addEventListener("click", async () => {
    const { error } = await db.from("guru").update({ status_akun: "Non Aktif" }).eq("id", confirmId);
    $("confirmModal").classList.add("hidden");
    if (error) { toast("Gagal menonaktifkan: " + error.message, "error"); return; }
    toast("Akun berhasil dinonaktifkan.", "success");
    await loadData();
  });

  // ---------- Tutup Modal ----------
  document.querySelectorAll("[data-close]").forEach((btn) => {
    btn.addEventListener("click", () => $(btn.dataset.close).classList.add("hidden"));
  });
  document.querySelectorAll(".modal").forEach((m) => {
    m.addEventListener("click", (e) => { if (e.target === m) m.classList.add("hidden"); });
  });

  // ============================================
  // TOAST
  // ============================================
  function toast(msg, type = "success") {
    const t = document.createElement("div");
    t.className = "toast " + type;
    t.innerHTML = `<i data-lucide="${type === "success" ? "check" : "alert-triangle"}"></i><span>${esc(msg)}</span>`;
    $("toastContainer").appendChild(t);
    lucide.createIcons();
    setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 300); }, 3200);
  }
</script>
</body>
</html>
