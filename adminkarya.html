<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel - Guru Berbagi Selogiri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--surface2:#f0f1f4;--border:#e4e6ea;--border2:#d5d8de;--t1:#16181d;--t2:#5c6270;--t3:#9aa0ad;--primary:#0d9488;--primary2:#0f766e;--amber:#b45309;--ambersoft:#fef3c7;--green:#15803d;--greensoft:#dcfce7;--red:#b91c1c;--redsoft:#fee2e2;--r:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--t1);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
.d-none{display:none!important}
#viewLogin{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 28px;text-align:center}
.login-logo{width:56px;height:56px;background:var(--t1);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#fff}
.login-logo svg{width:26px;height:26px}
.login-card h1{font-size:1.15rem;font-weight:800;margin-bottom:4px}
.login-card p{color:var(--t3);font-size:.8rem;margin-bottom:22px}
.in{width:100%;padding:11px 14px;border:1px solid var(--border2);border-radius:10px;background:var(--surface);font-size:.875rem;outline:none;margin-bottom:10px}
.in:focus{border-color:var(--primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:999px;font-weight:700;font-size:.82rem;padding:10px 18px;transition:all .15s}
.btn svg{width:15px;height:15px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff;width:100%}
.btn-primary:hover{background:var(--primary2)}
.btn-sm{padding:7px 13px;font-size:.75rem}
.btn-ghost{background:var(--surface);color:var(--t2);border:1px solid var(--border2)}
.btn-ghost:hover{background:var(--surface2)}
.login-err{color:var(--red);font-size:.78rem;font-weight:600;margin-top:8px;display:none}
.topbar{position:sticky;top:0;z-index:50;background:var(--t1);color:#fff;display:flex;align-items:center;gap:12px;padding:0 20px;height:56px}
.topbar-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:.9rem}
.topbar-brand .dot{width:32px;height:32px;background:var(--primary);border-radius:9px;display:flex;align-items:center;justify-content:center}
.topbar-brand .dot svg{width:17px;height:17px;color:#fff}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.topbar-email{font-size:.75rem;color:#9ca3af;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-logout{background:rgba(255,255,255,.1);color:#fff;border:none;border-radius:999px;padding:8px 14px;font-weight:700;font-size:.75rem;display:flex;align-items:center;gap:6px}
.btn-logout:hover{background:rgba(255,255,255,.2)}
.btn-logout svg{width:14px;height:14px}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.stat-val{font-size:1.5rem;font-weight:800}
.stat-lbl{font-size:.68rem;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.stat.pending .stat-val{color:var(--amber)}
.stat.ok .stat-val{color:var(--green)}
.stat.bad .stat-val{color:var(--red)}
.stat.teal .stat-val{color:var(--primary)}
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 16px;border-radius:999px;border:1px solid var(--border2);background:var(--surface);font-weight:700;font-size:.8rem;color:var(--t2);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab svg{width:14px;height:14px}
.tab.active{background:var(--t1);color:#fff;border-color:var(--t1)}
.tab .count{background:var(--ambersoft);color:var(--amber);border-radius:999px;padding:1px 7px;font-size:.68rem}
.tab.active .count{background:rgba(255,255,255,.2);color:#fff}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.toolbar .in{margin:0;flex:1;min-width:180px}
.toolbar select{width:auto;margin:0}
.item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.item-main{flex:1;min-width:200px}
.item-title{font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item-meta{font-size:.75rem;color:var(--t3);margin-top:3px}
.pill{padding:2px 9px;border-radius:999px;font-size:.65rem;font-weight:800}
.pill-pending{background:var(--ambersoft);color:var(--amber)}
.pill-ok{background:var(--greensoft);color:var(--green)}
.pill-bad{background:var(--redsoft);color:var(--red)}
.item-actions{display:flex;gap:6px;flex-shrink:0}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border2);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--t2)}
.iconbtn:hover{background:var(--surface2)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.green{color:var(--green);border-color:#bbf7d0;background:var(--greensoft)}
.iconbtn.red{color:var(--red);border-color:#fecaca;background:var(--redsoft)}
.empty{text-align:center;color:var(--t3);padding:40px 20px;font-size:.85rem}
.empty svg{width:36px;height:36px;margin:0 auto 10px;opacity:.4;display:block}
.contrib{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-bottom:8px}
.contrib-av{width:36px;height:36px;border-radius:50%;background:var(--greensoft);color:var(--primary2);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.contrib-info{flex:1;min-width:0}
.contrib-name{font-weight:700;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contrib-school{font-size:.72rem;color:var(--t3)}
.contrib-num{text-align:right;flex-shrink:0}
.contrib-num b{font-size:.95rem}
.contrib-num span{display:block;font-size:.65rem;color:var(--t3)}
.overlay{position:fixed;inset:0;background:rgba(15,18,25,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:14px;max-width:900px;width:100%;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.modal-head h3{font-size:.95rem;font-weight:800}
.modal-body{flex:1;background:var(--surface2)}
.modal-body iframe{width:100%;height:100%;min-height:420px;border:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--t1);color:#fff;padding:11px 20px;border-radius:999px;font-weight:700;font-size:.8rem;z-index:500;opacity:0;transition:all .3s;display:flex;gap:8px;align-items:center;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:15px;height:15px}
.spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="viewLogin">
  <div class="login-card">
    <div class="login-logo"><i data-lucide="shield-check"></i></div>
    <h1>Admin Panel</h1>
    <p>Guru Berbagi — Korwilcambidik Selogiri<br>Masuk dengan akun admin terpusat</p>
    <form onsubmit="doLogin(event)">
      <input type="email" class="in" id="admEmail" placeholder="email admin" autocomplete="username" required>
      <input type="password" class="in" id="admPass" placeholder="password" autocomplete="current-password" required>
      <button class="btn btn-primary" id="btnLogin"><i data-lucide="log-in"></i> Masuk sebagai Admin</button>
    </form>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div id="viewApp" class="d-none">
  <div class="topbar">
    <div class="topbar-brand"><span class="dot"><i data-lucide="shield-check"></i></span> ADMIN • GURU BERBAGI</div>
    <div class="topbar-right">
      <span class="topbar-email" id="admEmailLabel"></span>
      <button class="btn-logout" onclick="doLogout()"><i data-lucide="log-out"></i> Keluar</button>
    </div>
  </div>

  <div class="wrap">
    <div class="stats" id="statsBox"></div>

    <div class="tabs">
      <button class="tab active" data-tab="moderasi" onclick="pindahTab('moderasi')"><i data-lucide="clock"></i> Moderasi <span class="count" id="cntPending">0</span></button>
      <button class="tab" data-tab="semua" onclick="pindahTab('semua')"><i data-lucide="layers"></i> Semua Karya</button>
      <button class="tab" data-tab="kontributor" onclick="pindahTab('kontributor')"><i data-lucide="users"></i> Kontributor</button>
    </div>

    <div id="tab-moderasi"><div id="listPending"></div></div>

    <div id="tab-semua" class="d-none">
      <div class="toolbar">
        <input class="in" id="cariKarya" placeholder="Cari judul / nama guru..." oninput="renderSemua()">
        <select class="in" id="filterStatus" onchange="renderSemua()">
          <option value="">Semua Status</option>
          <option value="DISETUJUI">DISETUJUI</option>
          <option value="PENDING">PENDING</option>
          <option value="DITOLAK">DITOLAK</option>
        </select>
        <button class="btn btn-ghost btn-sm" onclick="muatData()"><i data-lucide="refresh-cw"></i> Muat Ulang</button>
      </div>
      <div id="listSemua"></div>
    </div>

    <div id="tab-kontributor" class="d-none"><div id="listKontributor"></div></div>
  </div>
</div>

<div class="overlay" id="previewOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="previewTitle">Preview</h3>
      <button class="iconbtn" onclick="tutupPreview()"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body" id="previewBody"></div>
  </div>
</div>

<div class="toast" id="toast"><i data-lucide="check-circle"></i><span id="toastMsg"></span></div>

<script>
/* ============================================================
   ADMIN: login via Supabase Auth project PUSAT.
   Semua operasi data via Edge Function admin-karya (project lama).
   ============================================================ */
const SSO_URL  = 'https://qamqqwfzhyiihqyzliwq.supabase.co';
const SSO_ANON = 'sb_publishable_O_qwmOBPSU8dylEPCrPRAA_GC25Ii5x';
const DATA_URL = 'https://qdgtfhknuvncbzsbcbwo.supabase.co';
const DATA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZ3RmaGtudXZuY2J6c2JjYndvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNzUyMzUsImV4cCI6MjEwMTg1MTIzNX0.GcEczGIaSO2twdTEK10_KedDPTzutr-EEl4vyNHG3bc';
const authClient = window.supabase.createClient(SSO_URL, SSO_ANON);

let ALL = [];
let ADMIN_TOKEN = '';
let tabAktif = 'moderasi';

/* ================= AUTH ================= */
window.addEventListener('DOMContentLoaded', async () => {
  lucide.createIcons();
  const { data } = await authClient.auth.getSession();
  if (data.session) masukApp(data.session);
});

async function doLogin(e){
  e.preventDefault();
  const email = document.getElementById('admEmail').value.trim();
  const pass  = document.getElementById('admPass').value;
  const err   = document.getElementById('loginErr');
  err.style.display = 'none';
  try {
    const { data, error } = await authClient.auth.signInWithPassword({ email, password: pass });
    if (error) throw error;
    masukApp(data.session);
  } catch (ex) {
    err.textContent = 'Gagal masuk: ' + ex.message;
    err.style.display = 'block';
  }
}

async function doLogout(){
  await authClient.auth.signOut();
  location.reload();
}

function masukApp(session){
  ADMIN_TOKEN = session.access_token;
  document.getElementById('viewLogin').classList.add('d-none');
  document.getElementById('viewApp').classList.remove('d-none');
  document.getElementById('admEmailLabel').textContent = session.user.email;
  muatData();
}

/* ================= PANGGIL EDGE FUNCTION ================= */
async function callAdmin(payload){
  const res = await fetch(DATA_URL + '/functions/v1/admin-karya', {
    method: 'POST',
    headers: { 'Content-Type':'application/json', apikey: DATA_ANON, Authorization: 'Bearer ' + ADMIN_TOKEN },
    body: JSON.stringify(payload)
  });
  const out = await res.json().catch(()=> ({}));
  if (!res.ok) throw new Error(out.error || ('Gagal ('+res.status+')'));
  return out;
}

/* ================= DATA ================= */
async function muatData(){
  document.getElementById('listPending').innerHTML = '<div class="spinner"></div>';
  try{
    const out = await callAdmin({ action: 'list' });
    ALL = out.data || [];
    renderStats(); renderPending(); renderSemua(); renderKontributor();
    lucide.createIcons();
  }catch(e){
    toast('Gagal memuat: ' + e.message);
    document.getElementById('listPending').innerHTML = '';
  }
}

function renderStats(){
  const total = ALL.length;
  const ok    = ALL.filter(r => r.Status === 'DISETUJUI').length;
  const pend  = ALL.filter(r => r.Status === 'PENDING').length;
  const tolak = ALL.filter(r => r.Status === 'DITOLAK').length;
  const views = ALL.reduce((a,r)=>a+(parseInt(r.VIEWS)||0),0);
  const guru  = new Set(ALL.map(r=>(r['Nama Guru']||'').trim()).filter(Boolean)).size;
  document.getElementById('cntPending').textContent = pend;
  document.getElementById('statsBox').innerHTML = `
    <div class="stat teal"><div class="stat-val">${total}</div><div class="stat-lbl">Total Karya</div></div>
    <div class="stat pending"><div class="stat-val">${pend}</div><div class="stat-lbl">Menunggu</div></div>
    <div class="stat ok"><div class="stat-val">${ok}</div><div class="stat-lbl">Tayang</div></div>
    <div class="stat bad"><div class="stat-val">${tolak}</div><div class="stat-lbl">Ditolak</div></div>
    <div class="stat"><div class="stat-val">${views.toLocaleString('id-ID')}</div><div class="stat-lbl">Total Views</div></div>
    <div class="stat"><div class="stat-val">${guru}</div><div class="stat-lbl">Kontributor</div></div>`;
}

function itemHTML(r, denganModerasi){
  const st = r.Status || 'PENDING';
  const pill = st === 'DISETUJUI' ? 'pill-ok' : (st === 'DITOLAK' ? 'pill-bad' : 'pill-pending');
  return `
  <div class="item">
    <div class="item-main">
      <div class="item-title">${esc(r['Judul Media'])} <span class="pill ${pill}">${st}</span></div>
      <div class="item-meta">${esc(r['Nama Guru'])} • ${esc(r['Nama Sekolah'])} • ${esc(r['Mata Pelajaran'])} • ${esc(r['Jenis Konten'])} • 👁 ${r.VIEWS||0}</div>
    </div>
    <div class="item-actions">
      <button class="iconbtn" title="Preview" onclick="preview('${r.ID}')"><i data-lucide="eye"></i></button>
      ${denganModerasi ? `
      <button class="iconbtn green" title="Setujui" onclick="setStatus('${r.ID}','DISETUJUI')"><i data-lucide="check"></i></button>
      <button class="iconbtn red" title="Tolak" onclick="setStatus('${r.ID}','DITOLAK')"><i data-lucide="x"></i></button>` : ''}
      <button class="iconbtn red" title="Hapus" onclick="hapus('${r.ID}')"><i data-lucide="trash-2"></i></button>
    </div>
  </div>`;
}

function renderPending(){
  const pend = ALL.filter(r => r.Status === 'PENDING');
  document.getElementById('listPending').innerHTML = pend.length
    ? pend.map(r => itemHTML(r, true)).join('')
    : `<div class="empty"><i data-lucide="inbox"></i>Tidak ada karya yang menunggu moderasi.</div>`;
}

function renderSemua(){
  const q = (document.getElementById('cariKarya').value || '').toLowerCase();
  const st = document.getElementById('filterStatus').value;
  const list = ALL.filter(r => {
    const teks = ((r['Judul Media']||'') + ' ' + (r['Nama Guru']||'')).toLowerCase();
    return (!q || teks.includes(q)) && (!st || r.Status === st);
  });
  document.getElementById('listSemua').innerHTML = list.length
    ? list.map(r => itemHTML(r, true)).join('')
    : `<div class="empty"><i data-lucide="search-x"></i>Tidak ada karya yang cocok.</div>`;
}

function renderKontributor(){
  const map = {};
  ALL.forEach(r => {
    const n = (r['Nama Guru']||'').trim();
    if (!n) return;
    if (!map[n]) map[n] = { nama:n, sekolah:r['Nama Sekolah']||'-', karya:0, views:0 };
    map[n].karya++;
    map[n].views += parseInt(r.VIEWS) || 0;
  });
  const arr = Object.values(map).sort((a,b) => b.karya - a.karya);
  document.getElementById('listKontributor').innerHTML = arr.length
    ? arr.map(c => `
      <div class="contrib">
        <div class="contrib-av">${c.nama.charAt(0).toUpperCase()}</div>
        <div class="contrib-info">
          <div class="contrib-name">${esc(c.nama)}</div>
          <div class="contrib-school">${esc(c.sekolah)}</div>
        </div>
        <div class="contrib-num"><b>${c.karya}</b> karya<span>${c.views.toLocaleString('id-ID')} views</span></div>
      </div>`).join('')
    : `<div class="empty">Belum ada kontributor.</div>`;
}

function pindahTab(t){
  tabAktif = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  ['moderasi','semua','kontributor'].forEach(x => {
    document.getElementById('tab-' + x).classList.toggle('d-none', x !== t);
  });
}

/* ================= AKSI ================= */
async function setStatus(id, status){
  try{
    await callAdmin({ action:'status', id, status });
    toast(status === 'DISETUJUI' ? '✅ Karya disetujui & tayang.' : 'Karya ditolak.');
    muatData();
  }catch(e){ toast('Gagal: '+e.message); }
}

async function hapus(id){
  if (!confirm('Hapus permanen karya ini?')) return;
  try{
    await callAdmin({ action:'delete', id });
    toast('Karya dihapus.');
    muatData();
  }catch(e){ toast('Gagal: '+e.message); }
}

async function preview(id){
  try{
    const out = await callAdmin({ action:'detail', id });
    const d = out.data || {};
    document.getElementById('previewTitle').textContent = d['Judul Media'] || 'Preview';
    const body = document.getElementById('previewBody');
    const html = d['Kode HTML/Canvas'] || '';
    const link = d['Link Media Luar'] || '';
    if (html && html.length > 10) {
      body.innerHTML = `<iframe sandbox="allow-scripts allow-same-origin" srcdoc="${escAttr(html)}"></iframe>`;
    } else if (link) {
      body.innerHTML = `<iframe src="${escAttr(link)}" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>`;
    } else {
      body.innerHTML = '<div class="empty">Tidak ada konten.</div>';
    }
    document.getElementById('previewOverlay').classList.add('open');
  }catch(e){ toast('Gagal: '+e.message); }
}
function tutupPreview(){
  document.getElementById('previewOverlay').classList.remove('open');
  document.getElementById('previewBody').innerHTML = '';
}

/* ================= UTIL ================= */
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function escAttr(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
let toastT=null;
function toast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  lucide.createIcons();
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove('show'), 2800);
}
</script>
</body>
</html>
